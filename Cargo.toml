[workspace]
members = ["rammux", "rammux-perf"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Razz4780/rammux"
authors = ["Michał Smolarek <msmolarekg@gmail.com>"]
rust-version = "1.95.0"

[workspace.dependencies]
rammux.path = "./rammux"

async-selector = "0.4"
async_smux = "0.3.4"
bitflags = "2"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
http-body = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
rand = "0.10"
rcgen = "0.14"
rstest = "0.26"
slab = "0.4"
socket2 = "0.6"
static_assertions = "1"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
yamux = "0.13"
