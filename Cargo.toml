[package]
name = "rammux"
version = "0.1.2"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Razz4780/rammux"
authors = ["Michał Smolarek <msmolarekg@gmail.com>"]
description = "Asynchronous stream multiplexer"
publish = true
keywords = ["multiplexer", "network", "protocol"]
categories = ["network-programming"]
rust-version = "1.95.0"

[dependencies]
async-selector = "0.4"
bitflags = "2"
bytes = "1"
futures = "0.3"
rand = "0.10"
slab = "0.4"
static_assertions = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "sync", "time"] }

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
rstest = "0.26"
socket2 = "0.6"
yamux = "0.13"
tokio-util = { version = "0.7", features = ["compat"] }
hyper = { version = "1", features = ["http2", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
tokio = { version = "1", features = ["full", "test-util"] }
async_smux = "0.3.4"
